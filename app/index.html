<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cine Time Montería</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header sticky top-0 z-50 bg-black/80 backdrop-blur border-b border-zinc-800">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-4">
    <a href="#inicio" class="font-black text-lg">Cine <span class="text-emerald-400">Time</span> Montería</a>
    <nav class="ml-auto flex gap-1 text-sm">
      <a class="px-3 py-2 rounded-lg hover:bg-zinc-800" href="#calculadora">Calcular</a>
      <a class="px-3 py-2 rounded-lg hover:bg-zinc-800" href="#peliculas">Películas</a>
    </nav>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4">
<section id="inicio" class="py-10">
  <h1 class="text-3xl md:text-5xl font-black leading-tight">¿Cuánto pagarías al cine?</h1>
  <p class="mt-3 text-zinc-300 text-lg">Elige día, hora y personas. Te decimos dónde sale más barato.</p>
</section>

<section id="calculadora" class="py-6 scroll-mt-24">
  <div class="card p-5 md:p-7 grid md:grid-cols-2 gap-6">
    <div class="space-y-4">
      <label class="block text-sm font-medium">Personas
        <input id="cPers" type="number" min="1" max="20" value="2" required class="mt-1 w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-3"></label>
      <label class="block text-sm font-medium">Día
        <select id="cDia" class="mt-1 w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-3"></select></label>
      <label class="block text-sm font-medium">Hora de la función
        <select id="cFranja" class="mt-1 w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-3">
          <option value="m">Antes de las 3:00 p. m.</option>
          <option value="t">3:00 a 7:59 p. m.</option>
          <option value="n">Desde las 8:00 p. m.</option></select></label>
      <button id="cBtn" class="btn w-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-3 rounded-xl">Calcular</button>
    </div>
    <div id="cOut" class="text-zinc-300 flex items-center justify-center text-center md:min-h-64" aria-live="polite">
      <p>Elige los datos y pulsa <strong>Calcular</strong>.</p>
    </div>
  </div>
</section>

<section id="peliculas" class="py-6 pb-16 scroll-mt-24">
  <h2 class="text-2xl font-black">Películas y funciones</h2>
  <div class="grid sm:grid-cols-2 gap-3 mt-4 mb-3">
    <label class="block text-sm text-zinc-300">Día
      <select id="filtroDia" class="mt-1 w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-3"></select></label>
    <label class="block text-sm text-zinc-300">Película
      <select id="filtroPelicula" class="mt-1 w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-3"></select></label>
  </div>
  <p id="estadoDatos" class="text-xs text-zinc-400 mb-4" aria-live="polite"></p>
  <div class="grid gap-4" id="peliculasLista"></div>
</section>
</main>

<footer class="text-center text-xs text-zinc-500 py-8 border-t border-zinc-800">
  Precios y horarios aproximados. Confirma con cada cine.
</footer>

<script src="script.js"></script>
</body>
</html>
